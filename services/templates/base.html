<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}video_me{% endblock %} — Dashboard</title>
  <link rel="stylesheet" href="/static/app.css?v=6">
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">video<span>_me</span></div>
  <div class="sidebar-nav">
    <a href="/" class="sidebar-link {% if active == 'jobs' %}active{% endif %}">
      <span class="icon">⬡</span> Jobs
    </a>
    <a href="/health" class="sidebar-link {% if active == 'health' %}active{% endif %}">
      <span class="icon">◎</span> Health
    </a>
    <a href="/gpu" class="sidebar-link {% if active == 'gpu' %}active{% endif %}">
      <span class="icon">▣</span> GPU
    </a>
    <a href="/api/docs" class="sidebar-link" target="_blank">
      <span class="icon">⊞</span> API Docs
    </a>
    <button class="sidebar-link sidebar-chat-btn" id="chat-toggle-btn" onclick="openChatDrawer()" title="Pipeline Assistant">
      <span class="icon">💬</span> Chat
    </button>
  </div>
  <div class="sidebar-footer">
    {% if worker %}
      Worker active<br>
      <span class="font-mono">{{ worker.worker_id[:24] }}</span>
    {% else %}
      <span style="color:#ef4444">No worker running</span>
    {% endif %}
  </div>
</nav>

<div class="main">
  {% block content %}{% endblock %}
</div>

<script src="/static/app.js?v=5"></script>
{% block scripts %}{% endblock %}

<!-- Chat drawer — slides in from left next to sidebar -->
<div class="chat-drawer" id="chat-drawer" style="display:none">
  <div class="chat-drawer-header">
    <div class="chat-drawer-title-group">
      <span class="chat-drawer-title">Pipeline Assistant</span>
      <span class="chat-job-label" id="chat-job-label">no job selected</span>
    </div>
    <button class="chat-close-btn" id="chat-close-btn" onclick="closeChatDrawer()" title="Close">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-empty">Open a job to start chatting about it.</div>
  </div>
  <div class="chat-input-row">
    <textarea id="chat-input" placeholder="Why did this job fail? (Ctrl+Enter to send)" rows="2"></textarea>
    <button class="btn btn-primary" id="chat-send-btn">Send</button>
  </div>
</div>
<div class="chat-overlay" id="chat-overlay" style="display:none"></div>

</body>
</html>
