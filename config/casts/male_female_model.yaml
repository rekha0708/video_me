    visual_descriptor: >
      An adult Indian woman model, mid-to-late 20s, confident and elegant.
      She has warm brown skin, expressive almond-shaped dark brown eyes, bold defined eyebrows, sharp facial features, and a magnetic gaze.
      Her eyes look confident, intense, slightly mysterious, and glamorous.
