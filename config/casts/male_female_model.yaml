      Her makeup is refined and glamorous, with strong eyeliner, defined lashes, glowing skin, and a soft nude or rose-toned lip.
      She wears a stylish modern outfit with subtle Indian elegance, such as a fitted dress, statement earrings, or a chic Indo-western look.
      Her posture is upright, graceful, and powerful.
      Overall vibe: bold, attractive, confident, elegant, feminine, charismatic, and high-fashion.

